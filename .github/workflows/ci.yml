name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install
        run: npm ci
      - name: Boundary checks
        run: |
          npm run check:airtable-boundary
          npm run check:dto-boundary
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build
